<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر شحن الألعاب</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #121212; color: white; padding: 20px; }
        .games-container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .game-card { background: #1e1e1e; padding: 20px; border-radius: 10px; width: 150px; margin-bottom: 10px; }
        button { background-color: #ff9800; border: none; padding: 10px 20px; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #e68900; }
        .contact-section { margin-top: 50px; background: #252525; padding: 20px; border-radius: 10px; max-width: 400px; margin-left: auto; margin-right: auto; }
        input[type="text"] { padding: 10px; width: 80%; margin-bottom: 10px; border-radius: 5px; border: none; text-align: center; }
    </style>
</head>
